name: Publish
on:
  push:
    # No `paths` filter: it did not fire on force-pushed orphan commits (seen in Asufa).
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r '.payload | fromjson | .version' update.json)
          if gh release view "v$v" >/dev/null 2>&1; then exit 0; fi
          gh release create "v$v" "Chotem-Setup-$v.exe" update.json --title "חותם $v" --notes "" --latest
