name: Publish
on:
  push:
    branches: [main]
    paths: [update.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r '.payload | fromjson | .version' update.json)
          gh release create "v$v" "Chotem-Setup-$v.exe" update.json --title "חותם $v" --notes "" --latest
